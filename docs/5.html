<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup 5 — Thin HUD</title>
  <link rel="stylesheet" href="assets/overlay.css">
</head>
<body class="layout-hud">
  <div class="stage">
    <div class="mock-bar"></div>
    <div class="mock-stool"></div>
    <div class="mock-stool"></div>
    <div class="mock-stool"></div>
    <div class="mock-stool"></div>
    <header class="chrome">
      <div class="chrome-title"><strong>5 / 5</strong> Thin HUD — stay up while you talk</div>
      <nav>
        <a href="index.html">Index</a>
        <a href="1.html">1 Card</a>
        <a href="2.html">2 Words</a>
        <a href="3.html">3 Columns</a>
        <a href="4.html">4 Preview</a>
        <a class="is-current" href="5.html">5 HUD</a>
      </nav>
    </header>
    <div class="overlay-root">
      <aside class="panel">
        <div class="panel-head">
          <div>
            <h1>Selector</h1>
            <p class="sub"><kbd>F7</kbd> hide · MCM rebind</p>
          </div>
        </div>
        <div class="panel-body">
          <div class="setting">
            <div class="setting-label">
              <h2>Follower interruption</h2>
              <span class="setting-value" data-value="followerInterruption"></span>
            </div>
            <div class="slider-track" data-slider="followerInterruption"></div>
          </div>
          <div class="setting">
            <div class="setting-label">
              <h2>Follower chattiness</h2>
              <span class="setting-value" data-value="followerChattiness"></span>
            </div>
            <div class="slider-track" data-slider="followerChattiness"></div>
          </div>
          <div class="setting">
            <div class="setting-label">
              <h2>Non-follower interruption</h2>
              <span class="setting-value" data-value="nonFollowerInterruption"></span>
            </div>
            <div class="slider-track" data-slider="nonFollowerInterruption"></div>
          </div>
          <div class="setting">
            <div class="setting-label">
              <h2>Non-follower chattiness</h2>
              <span class="setting-value" data-value="nonFollowerChattiness"></span>
            </div>
            <div class="slider-track" data-slider="nonFollowerChattiness"></div>
          </div>
        </div>
      </aside>
    </div>
  </div>
  <script src="assets/overlay.js"></script>
</body>
</html>
